name: "MarkFlow CodeQL config"

# Scan only first-party source; skip dependencies, build output, and test stubs
# to shorten analysis time and reduce false positives.
paths-ignore:
  - node_modules
  - dist
  - release
  - "**/*.test.ts"
  - "**/*.test.tsx"

# Default security suite plus the security-and-quality extended query pack
# (includes maintainability / correctness rules).
queries:
  - uses: security-and-quality
