name: Auto Create PR
# Automatically open (or keep up to date) a Pull Request from any conventional
# source branch (feature/*, fix/*, ci/*, chore/*, docs/*, refactor/*, build/*,
# test/*, perf/*) into `main` when that branch is pushed.
#
# All PR logic lives in actions/create-pr (the single source of truth, used by
# the CI workflow via the local composite Action
# `actions/create-pr`, extractable to its own repo), so the behaviour stays in
# one place.
#   - On the first triggering push: opens a PR using the repo's PR template,
#     with a generated "## Commits" list.
#   - On later pushes: if a PR already exists, its description is refreshed to
#     reflect the latest commits (idempotent — re-running on the same commits
#     is a no-op, never fails the workflow).
on:
    push:
        branches:
            - 'feature/**'
            - 'fix/**'
            - 'ci/**'
            - 'chore/**'
            - 'docs/**'
            - 'refactor/**'
            - 'build/**'
            - 'test/**'
            - 'perf/**'
    workflow_dispatch:

permissions:
    contents: read
    # NOTE: GitHub forbids the default GITHUB_TOKEN from creating/approving PRs
    # in the same repo ("GitHub Actions is not permitted to create or approve
    # pull requests"). We authenticate `gh` with a Personal Access Token stored
    # as the PR_TOKEN secret instead. The PAT must have the `repo` scope. The
    # workflow-level `pull-requests: write` below is harmless but does NOT lift
    # the GITHUB_TOKEN restriction — the PAT is what makes `gh pr create` work.
    pull-requests: write

concurrency:
    group: auto-pr-${{ github.ref }}
    cancel-in-progress: false

jobs:
    create-pr:
        name: Create / refresh PR to main
        runs-on: ubuntu-latest
        # Never act on the base branch itself.
        if: github.ref != 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history so `git log main..HEAD` is accurate.
                  fetch-depth: 0
            - name: Plan
              run: echo "::notice::Auto-PR triggered for branch '${{ github.ref_name }}' → will create or refresh a PR into 'main' (idempotent; re-runs are no-ops)."
            - name: Create / refresh PR
              # Explicit `head` overrides the action's GITHUB_HEAD_REF /
              # GITHUB_REF_NAME fallback, matching the prior
              # `--head "${{ github.ref_name }}"` behaviour.
              uses: ./actions/create-pr
              with:
                  head: ${{ github.ref_name }}
                  base: main
                  token: ${{ secrets.PR_TOKEN }}
            - name: Done
              if: success()
              run: echo "::notice::Auto-PR step completed for '${{ github.ref_name }}' → 'main' (see the action log above for create/refresh details)."
