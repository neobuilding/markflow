name: Auto Create PR
# Automatically open (or keep up to date) a Pull Request from any `feature/*`
# branch into `main` when that branch is pushed.
#
# All PR logic lives in scripts/create-pr.mjs (the single source of truth, also
# used by the local `npm run pr` command), so CI and local stay in sync.
#   - On the first triggering push: opens a PR using the repo's PR template,
#     with a generated "## Commits" list.
#   - On later pushes: if a PR already exists, its description is refreshed to
#     reflect the latest commits (idempotent — re-running on the same commits
#     is a no-op, never fails the workflow).
on:
    push:
        branches: ['feature/**']
    workflow_dispatch:

permissions:
    contents: read
    # NOTE: GitHub forbids the default GITHUB_TOKEN from creating/approving PRs
    # in the same repo ("GitHub Actions is not permitted to create or approve
    # pull requests"). We authenticate `gh` with a Personal Access Token stored
    # as the PR_TOKEN secret instead. The PAT must have the `repo` scope. The
    # workflow-level `pull-requests: write` below is harmless but does NOT lift
    # the GITHUB_TOKEN restriction — the PAT is what makes `gh pr create` work.
    pull-requests: write

concurrency:
    group: auto-pr-${{ github.ref }}
    cancel-in-progress: false

jobs:
    create-pr:
        name: Create / refresh PR to main
        runs-on: ubuntu-latest
        # Never act on the base branch itself.
        if: github.ref != 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history so `git log main..HEAD` is accurate.
                  fetch-depth: 0
            - name: Create / refresh PR
              env:
                  # Authenticate `gh` with a PAT (the default GITHUB_TOKEN cannot
                  # create PRs). Configure PR_TOKEN in repo Settings > Secrets with
                  # the `repo` scope.
                  GH_TOKEN: ${{ secrets.PR_TOKEN }}
              run: node scripts/create-pr.mjs --base main --head "${{ github.ref_name }}"
