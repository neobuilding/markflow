name: CodeQL Security Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Full re-scan every Monday at 03:30 UTC to pick up rules/vulns disclosed
        # between pushes.
        - cron: "30 3 * * 1"
    workflow_dispatch:

# Least privilege: code scanning only needs to read source and write back alerts.
permissions:
    contents: read
    security-events: write
    # actions: read  # required for private repos; can be omitted for public repos

jobs:
    analyze:
        name: Analyze (javascript-typescript)
        runs-on: ubuntu-latest
        steps:
            - name: Scan scope
              run: echo "::notice::CodeQL scan — languages=javascript-typescript, trigger=${{ github.event_name }}, ref=${{ github.ref }}. Findings feed code-scanning alerts."
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # full history improves data-flow analysis accuracy

            # Installing deps lets CodeQL resolve third-party library types/imports better.
            # (JS/TS are interpreted, so extraction works without deps, but results are more accurate with them.)
            - name: Setup Node and install deps
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: |
                  echo "::group::npm ci"
                  npm ci
                  echo "::endgroup::"

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  config-file: ./.github/codeql/codeql-config.yml

            # JS/TS are interpreted, so autobuild is not required; kept to cover edge cases that need compilation.
            - name: Autobuild
              uses: github/codeql-action/autobuild@v4

            - name: CodeQL analysis starting
              run: echo "::notice::Running CodeQL analysis (javascript-typescript) — long phase; failures surface as code-scanning alerts."
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: "javascript-typescript"
