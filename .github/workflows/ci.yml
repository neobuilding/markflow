name: CI & Release
run-name: >-
    ${{ github.event_name == 'workflow_dispatch' && format('CI & Release (manual dispatch by {0})', github.actor)
       || github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
       || github.ref_type == 'tag' && github.ref_name
       || github.event.head_commit.message }}
on:
    push:
        branches: [main]
        tags: ['v*'] # Manually pushing a v* tag triggers a "re-release": rebuild + open a new draft.
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read # Least privilege by default; only the release job elevates to write to push tags / create draft releases.

# Isolate concurrency per ref. cancel-in-progress is true ONLY for pull_request: a PR never ships a
# release, so its superseded runs are pure waste — cancelling them keeps concurrent runs from piling up
# now that every job fans out in parallel (one PR run = up to 6 jobs at once).
# push to main / tag push / workflow_dispatch stay false: cancelling an in-flight RELEASE build could
# leave a half-finished release behind (tag already pushed, artifact upload or draft creation interrupted).
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The version's single source of truth is the `version` job: it only "computes" (never "tags"),
# calculating the tag/version after checkout and emitting them as outputs;
# build / release read from the version job's outputs, avoiding duplicate inference and staying consistent.
#   - push to main / dispatch   → version computes v{ver}-{commit-time}.{shortSHA} (not pushed)
#   - push of a v* tag           → version reuses the existing tag (version = tag with the v stripped)
#   - PR / non-main branch push → version emits empty outputs: build injects nothing (uses the base version), release does not run
# The actual "tag push" is deferred to the release stage via the gh api (no checkout needed), so it is idempotent and reproducible;
# re-running on the same commit yields the same tag (commit time comes from the committer date, which is stable).
#
# Pipeline shape: maximum fan-out. `version`, `quality`, `ut`, `e2e` and the
# three-platform `build` all start immediately — only `build` waits on `version`,
# whose computed version it injects. `quality` deliberately gates NOTHING: a style,
# rule or type violation must not hide the unit-test, e2e and packaging results, so
# one CI run reports every problem at once and they can all be fixed locally in a
# single pass. Type checking / linting still run exactly ONCE, in the `quality` job
# (never duplicated inside ut / e2e / build).
# The trade-off is wasted work on a red run (e2e + three platforms keep going even
# when quality fails) — accepted on purpose, in exchange for complete feedback.
# The SINGLE gate of the pipeline is therefore `release`: it needs build, ut, e2e,
# quality and version, so no artifact is ever tagged or drafted from a red run.
env:
    CSC_IDENTITY_AUTOMATION: false # mac does not use signing/notarization automation (consistent with history)

jobs:
    # Single source of truth for the version: only "compute" (never "tag"); after
    # checkout it calculates the tag/version and emits them as outputs for downstream
    # jobs. Kept as its own job so `build` / `release` read one computed version
    # without every other job waiting on it.
    #   - push to main / dispatch   → v{ver}-{commit-time}.{shortSHA} (not pushed)
    #   - push of a v* tag           → reuse the existing tag (version = tag with the v stripped)
    #   - PR / non-main branch push → empty outputs: build injects nothing, release does not run
    version:
        name: Compute Version
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.compute.outputs.tag }}
            version: ${{ steps.compute.outputs.version }}
        steps:
            - uses: actions/checkout@v7
            - name: Compute version
              id: compute
              shell: bash
              run: |
                  set -e
                  # PR: do not infer a version; emit empty outputs so downstream jobs only validate.
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    echo "::notice::PR detected — emitting empty tag/version; build validates only, release is skipped."
                    echo "tag=" >> "$GITHUB_OUTPUT"
                    echo "version=" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    TAG="${GITHUB_REF_NAME}"
                    VERSION="${GITHUB_REF_NAME#v}"
                    echo "::notice::Tag push ${TAG}; reusing existing tag (version=${VERSION})."
                  else
                    echo "::group::Computing rolling version"
                    # Read the base version directly from the checked-out package.json (no API dependency).
                    # Explicitly validate that version is a non-empty string: missing/non-string/illegal-JSON
                    # exits non-zero; the `|| true` avoids being killed by set -e, so the friendly error below prints
                    # instead of silently generating an illegal tag.
                    BASE=$(node -p "const v=require('./package.json').version; if(typeof v!=='string'||!v){process.exit(1)} v" || true)
                    if [[ -z "$BASE" ]]; then
                      echo "::error::Failed to read the version field from package.json (missing or non-string)" >&2
                      echo "::endgroup::"
                      exit 1
                    fi
                    # Short SHA (first 7 chars of the full SHA).
                    SHA7="${GITHUB_SHA:0:7}"
                    # Commit time is taken from the committer date (stable, guarantees idempotency for the same commit).
                    CTIME=$(git show -s --format=%cI "${GITHUB_SHA}")
                    BUILDTIME="$(date -u -d "$CTIME" +%Y%m%dT%H%M%SZ)"
                    TAG="v${BASE}-${BUILDTIME}.${SHA7}"
                    VERSION="${BASE}-${BUILDTIME}.${SHA7}"
                    echo "::notice::Computed version: tag=${TAG} version=${VERSION} (base=${BASE}, short-sha=${SHA7}, commit-time=${BUILDTIME})."
                    echo "::endgroup::"
                  fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # ── Static quality (runs ONCE, in parallel — gates nothing) ─────────────────
    # `npm run quality` = Prettier format check + ESLint (TS7 side-by-side via the
    # `postinstall` shim in scripts/install-eslint-ts6.mjs) + Stylelint (CSS) +
    # Markdownlint (docs) + Secretlint (secrets) + full TypeScript type check
    # (`typecheck`).
    # Deliberately NOT a `needs` of ut / e2e / build: a failed style, rule or type
    # check must not mask the unit-test, e2e and packaging results — one CI run
    # should surface every problem at once. Style/rule/type violations are still
    # checked exactly ONCE, here (never duplicated in another job). `release` is
    # the job that stays needs-gated on this one, so a red quality job can never
    # produce a tagged / drafted release.
    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: { node-version-file: .nvmrc, cache: npm }
            - run: npm ci
            - name: Run quality gate
              run: |
                  echo "::group::Quality gate — prettier, eslint, stylelint, markdownlint, secretlint, typecheck"
                  npm run quality
                  echo "::endgroup::"

    # ── Unit tests + coverage (fully parallel; waits on nothing) ────────────────
    # UT (Vitest + jsdom) does NOT need the Electron build, so this job is otherwise
    # independent of the e2e job below. It also does NOT wait on `quality`: a lint /
    # type failure must not hide the test result. Type checking / linting happen
    # exactly once in the `quality` job, so this run only adds the covered unit tests.
    ut:
        name: Unit Tests & Coverage
        runs-on: ubuntu-latest
        # Elevated from the workflow-wide `contents: read` so dorny/test-reporter can
        # publish the JUnit summaries as a PR comment and Checks annotations.
        permissions:
            contents: read
            pull-requests: write
            checks: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: { node-version-file: .nvmrc, cache: npm }
            - run: npm ci
            # The Create/Refresh PR Action under actions/create-pr/ is intentionally
            # self-contained: its runtime dep `@actions/core` lives ONLY in
            # actions/create-pr/node_modules (never hoisted to the repo root, so the
            # directory stays extractable to its own repo). The root Vitest suite
            # imports core.mjs, which imports `@actions/core`, so CI must install that
            # local package before running `npm run test:coverage`. (Root `npm ci` does not walk
            # into actions/create-pr — there are no npm workspaces here.)
            - name: Install the self-contained PR Action's dependencies
              working-directory: actions/create-pr
              run: npm ci
            # Unit tests + coverage (Vitest + jsdom; no Electron build needed).
            - name: Run unit tests & coverage
              run: |
                  echo "::group::Unit tests + coverage (Vitest)"
                  npm run test:coverage
                  echo "::endgroup::"

            # Upload the coverage report (text + html + lcov) so it can be inspected from the run.
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/
                  if-no-files-found: warn
                  retention-days: 7

            # ── Scheme 1: render unit-test (Vitest JUnit) results into the PR/Checks UI ──
            # dorny/test-reporter turns the JUnit XML produced by Vitest into a rich
            # test summary on the run's Checks tab and a collapsible PR comment, so
            # failures are visible without downloading artifacts.
            - name: Publish unit test report
              if: always()
              continue-on-error: true # Reporting must never block the pipeline; a missing/failed report is non-fatal.
              uses: dorny/test-reporter@v3
              with:
                  name: Unit Tests (Vitest)
                  path: reports/unit/junit.xml
                  reporter: java-junit
                  fail-on-error: false

            # ── Scheme 2: upload test results to Codecov for Test Analytics ──
            # Codecov Test Analytics surfaces test run times, failure rates, and
            # flaky-test detection. It reuses the SAME Vitest JUnit XML (above),
            # downloading the Codecov CLI itself to perform the upload.
            # Non-blocking: a failed upload must never break the pipeline.
            - name: Upload test results to Codecov
              if: always()
              continue-on-error: true # Test Analytics is diagnostic; never fail CI on its account.
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: reports/unit/junit.xml

            # ── Scheme 3: upload coverage to Codecov for PR coverage diffs ──
            # Public repos are free; the lcov file is produced by `test:coverage`.
            - name: Upload coverage to Codecov
              if: always()
              uses: codecov/codecov-action@v7
              with:
                  report_type: coverage
                  files: coverage/lcov.info
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}

    # ── E2E: drive the REAL Electron app via Playwright (sharded + parallel) ──────
    # Why shard: e2e-app is the long pole (~37 functional specs, each launching its
    # own Electron against the shared Vite dev server from global-setup.ts). Running
    # it as ONE job serializes ~17 min of wall-clock. We split it across 4 jobs
    # (matrix) so each shard owns a dedicated 2-core runner. The parallelism comes
    # from the N shards running on N runners, NOT from --workers inside one job — the
    # shard command omits --workers so the config's adaptive formula (see
    # playwright.config.ts) stays the single source of truth. Clipboard + perf-gate
    # stay in a separate SERIAL job (the per-project workers cap is set in playwright.config.ts)
    # because they are destructive (real system clipboard) and timing-sensitive (perf
    # thresholds) respectively. See ADR-0027.
    # Every job is a separate runner (own npm ci + npm run build) — the setup tax of
    # sharding, accepted in exchange for the wall-clock win. Like `ut`, none of these
    # wait on `quality`, so a lint / type failure cannot hide the e2e result.
    e2e-app-shard:
        name: E2E App (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        runs-on: ubuntu-latest
        # fail-fast:false so one flaky shard does not cancel the others.
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        # Elevated for dorny/test-reporter (e2e JUnit) + Codecov annotations.
        permissions:
            contents: read
            pull-requests: write
            checks: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: { node-version-file: .nvmrc, cache: npm }
            - run: npm ci
            - name: Install Playwright browsers + OS deps
              run: npx playwright install --with-deps
            - name: Build main process (e2e)
              run: |
                  echo "::group::npm run build (e2e runner)"
                  npm run build
                  echo "::endgroup::"

            # Shard the e2e-app project across the matrix — parallelism comes from
            # running N shards on N runners (each a dedicated 2-core machine), NOT from
            # --workers inside one job. The shard command deliberately omits --workers, so
            # the worker count is whatever playwright.config.ts sets (see that file /
            # ADR-0027). This keeps the config the single source of truth for concurrency.
            - name: Run e2e app shard
              # Hard wall-clock cap on the whole step. A bad/unexecutable Electron
              # binary is already caught fast in e2e/global-setup.ts
              # (verifyElectronBinary) — which fails the run at globalSetup BEFORE any
              # spec runs. This timeout is only the last-resort backstop for silent
              # hangs (stuck Electron spawn, zombie child, etc.) that never surface as
              # an error. If verifyElectronBinary fails, its error message shows the
              # raw probe stderr — use that to diagnose (e.g. a chrome-sandbox
              # permission error means --no-sandbox is missing from the launch args).
              timeout-minutes: 20
              run: |
                  echo "::group::E2E app shard ${{ matrix.shard }}/${{ strategy.job-total }}"
                  xvfb-run --auto-servernum -- npx playwright test --project=e2e-app --shard=${{ matrix.shard }}/${{ strategy.job-total }}
                  echo "::endgroup::"
            - name: Upload e2e report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-app-${{ matrix.shard }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: warn
                  retention-days: 7
            # ── Scheme 1: render e2e (Playwright JUnit) results into the PR/Checks UI ──
            # Mirrors the unit-test report above for the end-to-end suite. (Playwright's
            # own `github` reporter already adds a native Checks view; this adds the
            # PR comment + historical run list in the test-reporter UI.)
            - name: Publish e2e report
              if: always()
              continue-on-error: true # Reporting must never block the pipeline; a missing/failed report is non-fatal.
              uses: dorny/test-reporter@v3
              with:
                  name: E2E App Shard ${{ matrix.shard }}
                  path: reports/e2e/junit.xml
                  reporter: java-junit
                  fail-on-error: false
            # ── Scheme 2 (E2E): upload Playwright test results to Codecov too ──
            # Feed the E2E JUnit XML into Codecov Test Analytics so end-to-end
            # run times / failures / flaky detection are tracked alongside unit tests.
            - name: Upload e2e results to Codecov
              if: always()
              continue-on-error: true # Test Analytics is diagnostic; never fail CI on its account.
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: reports/e2e/junit.xml

    # Clipboard (writes the REAL system clipboard) + perf-gate (hard timing thresholds)
    # must NEVER share the machine with anything else. `workers: 1` only caps concurrency
    # WITHIN a project — Playwright schedules the projects of ONE invocation concurrently — so
    # each of them gets its own step (its own invocation) below. The app specs are sharded
    # above, so this job stays short. e2e-perf-diag is excluded on purpose (run by hand).
    e2e-serial:
        name: E2E Clipboard + Perf Gate (serial)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            checks: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: { node-version-file: .nvmrc, cache: npm }
            - run: npm ci
            - name: Install Playwright browsers + OS deps
              run: npx playwright install --with-deps
            - name: Build main process (e2e)
              run: |
                  echo "::group::npm run build (e2e runner)"
                  npm run build
                  echo "::endgroup::"

            - name: Run e2e clipboard
              # Hard wall-clock cap on the whole step. A bad/unexecutable Electron
              # binary is already caught fast in e2e/global-setup.ts
              # (verifyElectronBinary) — which fails the run at globalSetup BEFORE any
              # spec runs. This timeout is only the last-resort backstop for silent
              # hangs (stuck Electron spawn, zombie child, etc.) that never surface as
              # an error. If verifyElectronBinary fails, its error message shows the
              # raw probe stderr — use that to diagnose (e.g. a chrome-sandbox
              # permission error means --no-sandbox is missing from the launch args).
              timeout-minutes: 25
              run: |
                  echo "::group::E2E clipboard (real system clipboard)"
                  xvfb-run --auto-servernum -- npx playwright test --project=e2e-clipboard
                  echo "::endgroup::"
            - name: Run e2e performance gate
              # The perf gate measures WALL-CLOCK latency, and Playwright schedules the
              # projects of one invocation CONCURRENTLY (playwright.config.ts, layer-2
              # note). Sharing the runner with the clipboard specs would make the gate
              # time the machine instead of the app, so it runs in its OWN invocation.
              # `--reporter=line --output=…` keeps this step from overwriting the
              # clipboard run's playwright-report/ and reports/e2e/junit.xml; its own
              # failure artifacts land in test-results/perf-gate/ and are uploaded below.
              # The step's exit code is what gates the job — the perf results stay in
              # this step's log.
              timeout-minutes: 25
              run: |
                  echo "::group::E2E perf-gate (own invocation)"
                  xvfb-run --auto-servernum -- npx playwright test --project=e2e-perf-gate --reporter=line --output=test-results/perf-gate
                  echo "::endgroup::"
            - name: Upload e2e report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-serial
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: warn
                  retention-days: 7
            # ── Scheme 1: render e2e (Playwright JUnit) results into the PR/Checks UI ──
            # Mirrors the unit-test report above for the end-to-end suite. (Playwright's
            # own `github` reporter already adds a native Checks view; this adds the
            # PR comment + historical run list in the test-reporter UI.)
            - name: Publish e2e report
              if: always()
              continue-on-error: true # Reporting must never block the pipeline; a missing/failed report is non-fatal.
              uses: dorny/test-reporter@v3
              with:
                  name: E2E Clipboard + Perf Gate
                  path: reports/e2e/junit.xml
                  reporter: java-junit
                  fail-on-error: false
            # ── Scheme 2 (E2E): upload Playwright test results to Codecov too ──
            # Feed the E2E JUnit XML into Codecov Test Analytics so end-to-end
            # run times / failures / flaky detection are tracked alongside unit tests.
            - name: Upload e2e results to Codecov
              if: always()
              continue-on-error: true # Test Analytics is diagnostic; never fail CI on its account.
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: reports/e2e/junit.xml

    # Always runs (PR / non-main push / main push / tag push / dispatch): three-platform build + dist.
    # This is the only three-platform build in the whole repo — PRs use it for validation, main/tag pushes for shipping,
    # avoiding duplicate builds. It starts as soon as the version is computed and does NOT wait for the test
    # suites, so packaging failures surface in the same run as test failures instead of only after they pass.
    # The version comes from the version job (the single source of truth): injected only when non-empty;
    # empty (PR) means the base package.json version is used.
    build:
        name: Build (${{ matrix.os }})
        needs: [version]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-latest, target: mac, artifact-name: markflow-macos }
                    - { os: windows-latest, target: win, artifact-name: markflow-windows }
                    - { os: ubuntu-latest, target: linux, artifact-name: markflow-linux }
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: { node-version-file: .nvmrc, cache: npm }

            # Install Linux dependencies (missing ones cause the AppImage build to fail).
            - name: Install Linux dependencies
              if: matrix.target == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libnss3-dev \
                    libsecret-1-dev \
                    libxss1 \
                    libgbm1 \
                    libasound2t64 \
                    librsvg2-bin \
                    rpm \
                    fakeroot \
                    libarchive-tools

            - run: npm ci

            # Inject the version computed by the version job (the single source of truth).
            # Non-empty (main/tag/dispatch) → the app's "About" and file names carry the full rolling version;
            # empty (PR) → not injected, the base package.json version is used.
            - name: Inject version from version job
              if: needs.version.outputs.version != ''
              shell: bash
              run: |
                  echo "::notice::Injecting version ${{ needs.version.outputs.version }} into package.json (target=${{ matrix.target }})."
                  npm version --no-git-tag-version --no-commit-hooks "${{ needs.version.outputs.version }}"

            # Always runs; documents which mode this build is in so the log is self-explanatory.
            - name: Version mode
              shell: bash
              run: |
                  if [[ -n "${{ needs.version.outputs.version }}" ]]; then
                    echo "::notice::Release/stamp path — build is versioned with ${{ needs.version.outputs.version }} and artifacts will be uploaded."
                  else
                    echo "::notice::Validation-only path — no version injection; build uses the base package.json version and release is skipped."
                  fi

            # `dist:*` scripts already run `npm run build`, so no separate build
            # step is needed here. PRs build the same artifacts as releases but
            # simply do not upload them.
            - name: Package distribution
              run: |
                  echo "::group::npm run dist:${{ matrix.target }}"
                  npm run dist:${{ matrix.target }} 2>&1 | tee "dist-${{ matrix.target }}.log"
                  echo "::endgroup::"

            # ADR-0037: the Windows exe is shipped unsigned, so electron-builder must never
            # attempt to download the winCodeSign toolset. Fail the build if it does.
            - name: Assert no winCodeSign download (win)
              if: matrix.target == 'win'
              shell: bash
              run: |
                  if grep -q "downloading winCodeSign" "dist-win.log"; then
                    echo "::error::electron-builder attempted to download winCodeSign — ADR-0037 regression"
                    exit 1
                  fi
                  echo "::notice::No winCodeSign download observed (ADR-0037)."

            # Upload artifacts only on the release path (version non-empty); PRs only validate and do not upload (saves storage).
            # Only upload final release formats (dmg/zip/AppImage), excluding unpacked dirs and other intermediates
            # to drastically shrink the artifact size.
            - name: Upload artifact (release path only)
              if: needs.version.outputs.version != ''
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.AppImage
                  if-no-files-found: error
                  retention-days: 7

    # Download the three-platform artifacts → push the tag (via API, idempotent) → generate SHA256SUMS →
    # create a draft release (not published).
    # File names already carry the full version (injected by build from the version job's version), so no renaming is needed;
    # only the allow-listed files are published, so nothing needs to be deleted.
    # "Tag push" is deferred here from the version job: create the git ref via gh api (no checkout needed);
    # if the tag already exists (e.g. on a re-run) it is skipped to avoid conflicts. Whether or not the draft is kept,
    # the tag remains (for traceability).
    # THIS IS THE SINGLE GATE of the pipeline. Every other job fans out in parallel (quality gates nothing),
    # so `release` is what guarantees no artifact is ever tagged or drafted from a red run: it needs build
    # (download artifacts), ut, e2e, quality AND version (read its computed tag). A failure — or a skip — in
    # any of them leaves this job skipped, so the draft release is simply never created.
    release:
        name: Draft Release
        # Needs build, ut, e2e, quality and version directly.
        # Note: the needs context only exposes outputs of *directly* depended-on jobs; version is an indirect
        # dependency of build, so if it were not listed here, needs.version.* would resolve to undefined (invalid CI context error).
        needs: [build, ut, e2e-app-shard, e2e-serial, quality, version]
        if: needs.version.outputs.tag != ''
        permissions:
            contents: write # Push tag + create draft release needs write permission.
        runs-on: ubuntu-latest
        steps:
            - name: Release plan
              run: echo "::notice::Release path active for tag ${{ needs.version.outputs.tag }} — will push the tag (if absent) and create a draft release (not published)."
            # Only the "computed version" path (non tag push) needs to push a tag; on a tag push the tag already exists.
            - name: Push tag (computed path only)
              if: github.ref_type != 'tag'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  TAG="${{ needs.version.outputs.tag }}"
                  # Idempotent: skip if it already exists; if creation fails, re-check whether it already exists
                  # (a concurrent re-run), and only error if it still cannot be created.
                  # Swallow stdout only, keep stderr so gh api anomalies (e.g. returning HTML) can be diagnosed.
                  if gh api -X GET "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null; then
                    echo "::notice::Tag $TAG already exists; skipping."
                  elif gh api -X POST "repos/${{ github.repository }}/git/refs" \
                      -f "ref=refs/tags/$TAG" \
                      -f "sha=${{ github.sha }}" >/dev/null; then
                    echo "::notice::Pushed tag $TAG."
                  elif gh api -X GET "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null; then
                    echo "::notice::Tag $TAG already exists (created by concurrent run); continuing."
                  else
                    echo "::error::Failed to push tag $TAG"
                    exit 1
                  fi

            - uses: actions/download-artifact@v8
              with: { path: artifacts }

            # Only verify the actually-published file types (dmg/zip/AppImage), which naturally excludes
            # builder-debug.yml and *-unpacked dirs, so no manual deletion is needed.
            # ⚠️ If electron-builder.json5 adds/removes targets (e.g. deb/exe), update the globs below accordingly.
            - name: Generate SHA256SUMS
              run: |
                  echo "::group::Generating SHA256SUMS"
                  cd artifacts
                  find markflow-macos markflow-windows markflow-linux -maxdepth 1 -type f \( \
                    -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -print0 \
                    | sort -z | xargs -0 sha256sum > SHA256SUMS
                  cat SHA256SUMS
                  echo "::endgroup::"

            # Publish only files on the allow-list; draft=true leaves the decision to a human, the flow does not auto-publish.
            - name: Create draft Release
              uses: softprops/action-gh-release@v3
              with:
                  name: ${{ needs.version.outputs.tag }}
                  tag_name: ${{ needs.version.outputs.tag }}
                  draft: true
                  prerelease: false
                  overwrite_files: true # On a re-release (re-run on the same tag), overwrite the same-named files of the existing draft instead of failing.
                  files: |
                      artifacts/markflow-macos/*.dmg
                      artifacts/markflow-windows/*.zip
                      artifacts/markflow-linux/*.AppImage
                      artifacts/SHA256SUMS
                  generate_release_notes: true
