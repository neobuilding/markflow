# .github/dependabot.yml
version: 2
updates:
  # npm dependencies (includes devDependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Group all npm updates (major / minor / patch) into a single PR to minimize branch noise
      npm-all:
        patterns: ["*"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group all GitHub Actions updates into a single PR
      actions-all:
        patterns: ["*"]
