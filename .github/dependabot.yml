# .github/dependabot.yml
version: 2

updates:
  # ======================
  # npm / yarn dependencies
  # ======================
  - package-ecosystem: "npm"
    # Scan both the repo root and the standalone create-pr GitHub Action, which
    # has its own package.json/package-lock.json (not an npm workspace of root).
    # `directories` keeps them in the same npm-all / npm-security grouped PRs.
    directories:
      - "/"
      - "/actions/create-pr"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5          # Only limits version updates; security updates are unaffected
    labels:
      - "dependencies"
    groups:
      # All regular version updates → combined into 1 PR
      npm-all:
        patterns: ["*"]
        # Defaults to applies-to: version-updates (can be omitted)

      # All security updates → combined into a separate PR (important)
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # ======================
  # GitHub Actions
  # ======================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # All Actions version updates → 1 PR
      actions-all:
        patterns: ["*"]

      # All Actions security updates → 1 PR
      actions-security:
        applies-to: security-updates
        patterns: ["*"]